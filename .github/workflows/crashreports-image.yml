# Builds the crash report service (crashreports/) and publishes it to
# ghcr.io/mumcord/mumcord-crashreports for amd64 and arm64. Deploying is the same
# manual step as for the website: "Run pipeline" in tvorwachs/mumcord-www-deploy.
name: Crashreports image

on:
  push:
    branches: [main]
    paths: ["crashreports/**", ".github/workflows/crashreports-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: crashreports-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/mumcord/mumcord-crashreports

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crashreports/package-lock.json
      - name: Tests and typecheck
        working-directory: crashreports
        run: npm ci && npm run typecheck && npm test

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v7
        with:
          context: crashreports
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=crashreports
          cache-to: type=gha,mode=max,scope=crashreports
