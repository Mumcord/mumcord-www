# Builds the website image and publishes it to ghcr.io/mumcord/mumcord-www for
# amd64 and arm64 (the fuewa.systems server is arm64). Deploying is a separate,
# manual step: "Run pipeline" in gitlab.fuewa.systems/tvorwachs/mumcord-www-deploy.
#
# The nightly run refreshes the release data behind the download links.
name: Image

on:
  push:
    branches: [main]
    paths-ignore: ["crashreports/**", ".github/workflows/crashreports-image.yml"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/mumcord/mumcord-www

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The site is built here rather than in Docker so Astro's image cache survives between
      # runs: only new or changed screenshots get resized, not all of them every time.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-assets-${{ hashFiles('src/assets/**', 'package-lock.json') }}
          restore-keys: astro-assets-
      - run: npm run build
        env:
          SITE_URL: https://mumcord.app
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.serve
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
