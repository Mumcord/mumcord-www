# Builds the website image and publishes it to ghcr.io/mumcord/mumcord-www for
# amd64 and arm64 (the fuewa.systems server is arm64). Deploying is a separate,
# manual step: "Run pipeline" in gitlab.fuewa.systems/tvorwachs/mumcord-www-deploy.
#
# The nightly run refreshes the release data behind the download links.
name: Image

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/mumcord/mumcord-www

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-args: |
            SITE_URL=https://mumcord.app
            RELEASE_CHECK=${{ github.run_id }}-${{ github.run_attempt }}
          # The token only lives in the build stage (release data), never in the final image.
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
